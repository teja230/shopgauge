# Test configuration for Spring Boot tests
spring.application.name=storesight-backend-test

# Database - Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate - Optimized for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.database=h2

# Disable Redis, Flyway, and all actuator auto-configurations for unit tests (integration tests will override this)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,org.springframework.boot.actuate.autoconfigure.metrics.export.simple.SimpleMetricsExportAutoConfiguration,org.springframework.boot.actuate.autoconfigure.health.HealthEndpointAutoConfiguration,org.springframework.boot.actuate.autoconfigure.endpoint.EndpointAutoConfiguration,org.springframework.boot.actuate.autoconfigure.endpoint.web.WebEndpointAutoConfiguration,org.springframework.boot.actuate.autoconfigure.endpoint.jmx.JmxEndpointAutoConfiguration,org.springframework.boot.actuate.autoconfigure.web.server.ManagementContextAutoConfiguration,org.springframework.boot.actuate.autoconfigure.web.servlet.ServletManagementContextAutoConfiguration,org.springframework.boot.actuate.autoconfigure.web.ManagementContextAutoConfiguration
spring.flyway.enabled=false
spring.main.allow-bean-definition-overriding=true

# Session configuration for tests
spring.session.store-type=none
spring.session.timeout=10m

# External services - Use dummy values for tests
sendgrid.api-key=${SENDGRID_API_KEY:test_sendgrid_key}
twilio.account_sid=${TWILIO_ACCOUNT_SID:test_twilio_sid}
twilio.auth_token=${TWILIO_AUTH_TOKEN:test_twilio_token}
twilio.from_number=${TWILIO_FROM_NUMBER:+1234567890}

# Shopify - Use test values
shopify.api.key=${SHOPIFY_API_KEY:test_key}
shopify.api.secret=${SHOPIFY_API_SECRET:test_secret}
shopify.scopes=read_products,read_orders,read_customers,read_inventory
shopify.redirect_uri=${SHOPIFY_REDIRECT_URI:https://api.shopgaugeai.com/api/auth/shopify/callback}

# Discovery services - Disable for tests
discovery.enabled=false
discovery.serpapi.key=${SERPAPI_KEY:test_serpapi_key}
discovery.serpapi.max-results=${SERPAPI_MAX_RESULTS:3}

# Logging - Simplified for tests to avoid configuration issues
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.com.storesight=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.testcontainers=WARN
logging.level.org.flywaydb=WARN

# Use test-specific logback configuration
logging.config=classpath:logback-test.xml

# Server
server.port=0

# Frontend URL
frontend.url=http://localhost:3000

# SSE Configuration for tests
storesight.sse.max-connections-per-shop=5
storesight.sse.max-connections-global=50
storesight.sse.connection-timeout=PT2M
storesight.sse.heartbeat-interval=PT30S
storesight.sse.cleanup-interval=PT1M
storesight.sse.max-batch-size=10
storesight.sse.batch-timeout=PT1S
storesight.sse.max-batch-queue-size=100
storesight.sse.connection-health-check-interval=PT45S
storesight.sse.dead-connection-timeout=PT90S
storesight.sse.batch-cleanup-interval=PT30S
storesight.sse.max-failed-heartbeats=3
storesight.sse.batch-memory-cleanup-threshold=PT5M
storesight.sse.max-batch-memory-size-bytes=1048576
storesight.sse.connection-idle-timeout=PT10M
storesight.sse.emergency-cleanup-threshold=80

# Session Configuration for tests
storesight.session.lock-duration=PT5S
storesight.session.invalidation-tracking-duration=PT1H
storesight.session.stuck-session-timeout=PT5M
storesight.session.orphaned-lock-timeout=PT10M
storesight.session.session-data-ttl=PT4H
storesight.session.session-token-ttl=PT2H
storesight.session.shop-sessions-ttl=PT1H
storesight.session.invalid-session-ttl=PT15M
storesight.session.max-sessions-per-shop=5
storesight.session.session-inactivity-hours=4
storesight.session.session-cleanup-days=2
storesight.session.redis-cache-ttl-minutes=60
storesight.session.redis-fallback-ttl-minutes=60
storesight.session.invalid-session-cache-minutes=15

# Cache Configuration for tests
storesight.cache.default-ttl=PT15M
storesight.cache.memory-ttl=PT5M
storesight.cache.max-memory-cache-size=1000
storesight.cache.cleanup-interval=PT5M
storesight.cache.statistics-interval=PT10M
storesight.cache.max-batch-size=50
storesight.cache.batch-timeout=PT30S

# Monitoring Configuration for tests
storesight.monitoring.system-resources-interval=PT1M
storesight.monitoring.database-interval=PT2M
storesight.monitoring.redis-interval=PT3M
storesight.monitoring.session-cleanup-interval=PT5M
storesight.monitoring.sse-cleanup-interval=PT1M
storesight.monitoring.cache-cleanup-interval=PT5M
storesight.monitoring.dashboard-collection-interval=PT30S
storesight.monitoring.health-check-interval=PT30S
storesight.monitoring.connection-test-timeout=PT5S
storesight.monitoring.memory-warning-threshold=80
storesight.monitoring.memory-critical-threshold=95
storesight.monitoring.cpu-warning-threshold=80
storesight.monitoring.cpu-critical-threshold=95
storesight.monitoring.disk-warning-threshold=80
storesight.monitoring.disk-critical-threshold=95
storesight.monitoring.connection-pool-warning-threshold=80
storesight.monitoring.connection-pool-critical-threshold=95
storesight.monitoring.stuck-session-threshold=5
storesight.monitoring.sse-error-rate-threshold=10
storesight.monitoring.database-error-rate-threshold=5
storesight.monitoring.cache-hit-rate-threshold=50

# Security Configuration for tests
storesight.security.rate-limit-window=PT1M
storesight.security.rate-limit-requests=60
storesight.security.admin-session-timeout=PT1H
storesight.security.max-login-attempts=5
storesight.security.lockout-duration=PT15M
storesight.security.token-expiry=PT24H
storesight.security.require-https=true
storesight.security.audit-logging=true
storesight.security.csrf-enabled=true
storesight.security.xss-protection=true
storesight.security.content-security-policy=true
storesight.security.session-validation-interval=PT5M
storesight.security.ip-validation-timeout=PT30M

# Discovery Configuration for tests
storesight.discovery.cache-timeout=PT2H
storesight.discovery.max-results=10
storesight.discovery.max-concurrent-requests=3
storesight.discovery.request-timeout=PT30S
storesight.discovery.rate-limit-delay=PT0.5S
storesight.discovery.max-suggestions-per-product=5
storesight.discovery.max-products-per-shop=50
storesight.discovery.max-total-suggestions=200
storesight.discovery.max-urls-per-shop=100
storesight.discovery.max-products=20
storesight.discovery.keyword-cache-ttl=PT30M
storesight.discovery.min-keyword-frequency=2 

management.endpoints.enabled-by-default=false
management.health.enabled=false 