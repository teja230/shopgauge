# Production-specific configuration
# This file OVERRIDES selected properties from application.properties for production
# Most configurations are inherited from application.properties - only production-specific changes here

# =============================================================================
# LOGGING CONFIGURATION - Reduce startup noise only
# =============================================================================
logging.level.org.springframework=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.context=WARN
logging.level.org.springframework.beans=WARN
logging.level.org.springframework.core=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.storesight=INFO

# Disable SQL logging in production for performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# DATABASE CONNECTION POOL - Production optimized for Render Hobby plan (512MB)
# =============================================================================
# UPDATED: For 2x512MB instances with shared load
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=600000

# =============================================================================
# FLYWAY - Production safe settings
# =============================================================================
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# =============================================================================
# MANAGEMENT ENDPOINTS - Secure production settings
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# =============================================================================
# SERVER CONFIGURATION - Optimized for 2x512MB with CPU throttling
# =============================================================================
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.secure=true
server.servlet.session.http-only=true

# Tomcat optimization for 2x512MB with CPU limits
server.tomcat.max-threads=25
server.tomcat.max-connections=100
server.tomcat.accept-count=25
server.tomcat.connection-timeout=10000
server.tomcat.keep-alive-timeout=15000
server.tomcat.max-keep-alive-requests=25
server.tomcat.max-http-form-post-size=512KB
server.tomcat.max-swallow-size=512KB
server.tomcat.async-timeout=10000

# =============================================================================
# APPLICATION STARTUP - Reduce noise
# =============================================================================
spring.main.banner-mode=off
spring.output.ansi.enabled=never

# =============================================================================
# CACHE CONFIGURATION - Reduced for CPU optimization
# =============================================================================
spring.cache.caffeine.spec=maximumSize=250,expireAfterWrite=15m

# =============================================================================
# REDIS CONNECTION POOL - Conservative for 2x512MB
# =============================================================================
spring.data.redis.lettuce.pool.max-active=3
spring.data.redis.lettuce.pool.max-idle=2
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=1s
spring.data.redis.timeout=2s

# =============================================================================
# JVM AND MEMORY OPTIMIZATION
# =============================================================================
# JPA batch processing - reduce CPU overhead
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =============================================================================
# ASYNC PROCESSING LIMITS - Prevent CPU saturation
# =============================================================================
# Custom properties for async processing
storesight.async.discovery.max-concurrent=1
storesight.async.scraping.max-concurrent=2
storesight.async.notification.max-concurrent=2
storesight.async.queue-capacity=100
storesight.async.max-retry-attempts=2

# =============================================================================
# MONITORING INTERVALS - Ultra-conservative for maximum reliability
# =============================================================================
# CRITICAL: Less frequent monitoring maximizes application reliability
# Real-time monitoring is NOT needed - stability is the priority
storesight.monitoring.system-resources-interval=PT6H
storesight.monitoring.system-resources-startup-delay=PT20M
storesight.monitoring.dashboard-collection-interval=PT8H
storesight.monitoring.dashboard-collection-startup-delay=PT25M
storesight.monitoring.health-check-interval=PT6H
storesight.monitoring.health-check-startup-delay=PT30M
storesight.monitoring.alerting-interval=PT12H
storesight.monitoring.alerting-startup-delay=PT35M
storesight.monitoring.sse-cleanup-interval=PT15M
storesight.monitoring.sse-cleanup-startup-delay=PT40M

# =============================================================================
# ADDITIONAL MONITORING OPTIMIZATIONS
# =============================================================================
# Disable non-essential monitoring for maximum reliability
storesight.monitoring.performance-metrics-interval=PT24H
storesight.monitoring.performance-metrics-startup-delay=PT45M
storesight.monitoring.database-interval=PT8H
storesight.monitoring.database-startup-delay=PT50M
storesight.monitoring.redis-interval=PT12H
storesight.monitoring.redis-startup-delay=PT55M

# Session cleanup optimization - less frequent for reliability
storesight.session.synchronization-cleanup-interval=PT4H
storesight.session.synchronization-cleanup-startup-delay=PT60M
storesight.session.stuck-markers-cleanup-interval=PT6H
storesight.session.stuck-markers-cleanup-startup-delay=PT65M
storesight.session.critical-stuck-markers-cleanup-interval=PT8H
storesight.session.critical-stuck-markers-cleanup-startup-delay=PT70M
storesight.session.expired-sessions-cleanup-interval=PT6H
storesight.session.expired-sessions-cleanup-startup-delay=PT75M
storesight.session.stale-sessions-cleanup-interval=PT8H
storesight.session.stale-sessions-cleanup-startup-delay=PT80M

# Cache optimization - minimal cleanup for reliability
storesight.cache.cleanup-interval=PT4H
storesight.cache.statistics-interval=PT12H

# Database performance analysis - nightly only
database.monitoring.analysis-interval-minutes=1440
database.monitoring.log-slow-queries=false

# Disable heavy metrics collection for reliability
management.metrics.enable.http=false
management.metrics.enable.tomcat=false
management.metrics.enable.hikaricp=false
management.metrics.enable.cache=false
management.metrics.enable.jdbc=false

# Keep only essential JVM metrics for monitoring dashboards
# Note: JVM metrics are already enabled above for monitoring dashboards

# Disable detailed health checks for performance
# Note: Health check settings are inherited from application.properties

# Reduce logging verbosity for monitoring services
logging.level.com.storesight.backend.service.SystemResourceMonitoringService=WARN
logging.level.com.storesight.backend.service.MonitoringDashboardService=WARN
logging.level.com.storesight.backend.service.AlertingService=WARN
logging.level.com.storesight.backend.service.PerformanceMetricsService=WARN

# =============================================================================
# CPU THRESHOLDS - Optimized for starter plan
# =============================================================================
# Balanced thresholds for 2-instance setup
alerting.cpu.warning.threshold=80
alerting.cpu.critical.threshold=95
alerting.memory.warning.threshold=80
alerting.memory.critical.threshold=95
alerting.disk.warning.threshold=85
alerting.disk.critical.threshold=95

# =============================================================================
# JVM METRICS - ENABLED for monitoring dashboards
# =============================================================================
# Keep JVM metrics enabled as they're used in monitoring dashboards
management.metrics.export.prometheus.enabled=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# =============================================================================
# SECURITY - Production defaults
# =============================================================================
storesight.security.require-https=true
storesight.security.audit-logging=true
storesight.security.csrf-enabled=true

# =============================================================================
# MONITORING - Production environment tag
# =============================================================================
management.metrics.tags.environment=production

# =============================================================================
# RESOURCE LIMITS - Optimized for 2-instance starter plan
# =============================================================================
# CURRENT SETTINGS: Optimized for 2x512MB instances (1GB total)
# SSE Limits - Keep your requested values
storesight.sse.max-connections-per-shop=3
storesight.sse.max-connections-global=20

# When upgrading to higher Render plan (1GB+), change to:
# storesight.sse.max-connections-per-shop=5
# storesight.sse.max-connections-global=50
# async.processing.discovery.max-concurrent=3
# async.processing.scraping.max-concurrent=5
# async.processing.notification.max-concurrent=10
# async.processing.queue.capacity=1000

# Cache Limits - Minimum required value for validation
storesight.cache.max-memory-cache-size=100

# Async Processing - Optimized for 2 instances
async.processing.discovery.max-concurrent=2
async.processing.scraping.max-concurrent=3
async.processing.notification.max-concurrent=5
async.processing.queue.capacity=500

# Session Limits - Optimized for 2 instances
storesight.session.max-sessions-per-shop=5

# =============================================================================
# DISCOVERY LIMITS - Production safe
# =============================================================================
storesight.discovery.max-concurrent-requests=3
competitor.scraping.max-concurrent-scrapers=3

# =============================================================================
# REDIS CONNECTION POOL - Optimized for 2 instances
# =============================================================================
# Note: Redis pool settings are inherited from application.properties
# Override only if needed for 2-instance optimization

# =============================================================================
# TOMCAT THREADS - Optimized for 2 instances
# =============================================================================
# Note: Tomcat settings are inherited from application.properties
# Override only if needed for 2-instance optimization

