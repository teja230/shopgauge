# Production Profile Configuration
# This profile is used for production environment

# CORS Configuration for Production
# Strict CORS policy for production domains
cors.allowed-origins=https://www.shopgaugeai.com,https://shopgaugeai.com

# Security Configuration for Production
security.rate-limit.enabled=true
security.rate-limit.requests-per-minute=60
security.debug-endpoints.enabled=false

# Production-specific settings
logging.level.com.storesight=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Production frontend URL
frontend.url=https://www.shopgaugeai.com

# Production Shopify redirect URI
shopify.redirect_uri=https://api.shopgaugeai.com/api/auth/shopify/callback

# Production Database Connection Pool Configuration - OPTIMIZED FOR AUTO-RECOVERY
# CRITICAL: Disable custom database configuration to prevent conflicts
storesight.database.custom-config.enabled=false

# Production-optimized pool settings (use environment variables for flexibility)
spring.datasource.hikari.pool-name=StoresightHikariCP-Prod

# OPTIMIZED: Connection pool sizes for production with auto-scaling capability
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}

# OPTIMIZED: Connection timeouts for faster failure detection and recovery
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:25000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT:3000}

# CRITICAL: Leak detection optimized for production with auto-recovery
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION:30000}

# OPTIMIZED: Connection reliability settings
spring.datasource.hikari.allow-pool-suspension=false
spring.datasource.hikari.initialization-fail-timeout=5000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# AUTO-RECOVERY: Connection properties for better reliability and auto-recovery
spring.datasource.hikari.data-source-properties.autoReconnect=true
spring.datasource.hikari.data-source-properties.maxReconnects=3
spring.datasource.hikari.data-source-properties.initialTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=20000
spring.datasource.hikari.data-source-properties.connectTimeout=15000
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.loginTimeout=10

# AUTO-RECOVERY: PostgreSQL-specific optimizations for auto-recovery
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.ApplicationName=StoresightApp-Prod

# AUTO-RECOVERY: Additional PostgreSQL performance settings
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.useLocalTransactionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false

# CRITICAL: Flyway-specific connection management to prevent leaks during migrations
# DISABLE custom Flyway configuration to prevent connection issues
storesight.flyway.custom.enabled=false
# Use Spring Boot auto-configuration with optimized settings
spring.flyway.connect-retries=3
spring.flyway.connect-retries-interval=3
spring.flyway.lock-retry-count=30
# Critical: Prevent connection timeouts during long-running migrations
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
# Ignore existing index warnings to prevent build failures
spring.flyway.ignore-migration-patterns=*:missing,*:ignored

# Production Redis Configuration - Enhanced timeouts and reliability
spring.data.redis.timeout=8s
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=6
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3s

# Production Session Configuration - Aligned with business app standards
spring.session.timeout=4h
spring.session.redis.namespace=storesight:prod:sessions
spring.session.redis.flush-mode=on-save

# AUTO-RECOVERY: Enhanced monitoring and health checks
management.endpoints.enabled-by-default=true
management.endpoints.web.exposure.include=health,info,metrics,hikaricp
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.db.enabled=true
management.health.redis.enabled=true

# AUTO-RECOVERY: JPA Configuration optimized for connection pool management
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.connection.autocommit=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=5000
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# AUTO-RECOVERY: Transaction timeout settings
spring.transaction.default-timeout=30s
spring.jpa.properties.jakarta.persistence.query.timeout=15000

# AUTO-RECOVERY: Tomcat connection pool settings
server.tomcat.max-threads=150
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100
server.tomcat.async-timeout=30000

# AUTO-RECOVERY: Scheduling configuration for monitoring services
spring.task.scheduling.pool.size=5
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100

# AUTO-RECOVERY: Enable AOP for connection monitoring
spring.aop.auto=true
spring.aop.proxy-target-class=true

# CRITICAL: Production database URL with correct host format
spring.datasource.url=jdbc:postgresql://dpg-d1d3qvumcj7s73fcu4jg-a.oregon-postgres.render.com:5432/storesight 

# AUTO-RECOVERY: Additional database monitoring settings
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.metric-registry=hikariMetricRegistry

# AUTO-RECOVERY: Logging configuration for better debugging
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari.pool.HikariPool=DEBUG
logging.level.com.storesight.backend.service.ConnectionPoolMonitoringService=INFO
logging.level.com.storesight.backend.service.ConnectionLeakDetectionService=INFO
logging.level.com.storesight.backend.service.DatabaseCircuitBreakerService=INFO

# AUTO-RECOVERY: Circuit breaker and monitoring service configuration
circuit-breaker.enabled=true
connection-pool-monitoring.enabled=true
adaptive-pool-sizing.enabled=true

# AUTO-RECOVERY: Configurable monitoring intervals (balanced approach)
monitoring.connection-pool.interval=60000
monitoring.database-health.interval=90000
monitoring.connection-leak.interval=300000
monitoring.adaptive-pool.interval=300000
monitoring.circuit-breaker.interval=120000

# AUTO-RECOVERY: Alert configuration for connection pool issues
alerts.connection-pool.enabled=true
alerts.connection-pool.threshold.utilization=0.85
alerts.connection-pool.threshold.timeout=30000
alerts.connection-pool.threshold.leaks=3 