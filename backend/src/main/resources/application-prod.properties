# Production-specific configuration
# This file OVERRIDES selected properties from application.properties for production
# Most configurations are inherited from application.properties - only production-specific changes here

# =============================================================================
# LOGGING CONFIGURATION - Reduce startup noise only
# =============================================================================
logging.level.org.springframework=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.context=WARN
logging.level.org.springframework.beans=WARN
logging.level.org.springframework.core=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.storesight=INFO

# Disable SQL logging in production for performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# DATABASE CONNECTION POOL - Dynamic based on memory profile
# =============================================================================
# These will be overridden by MemoryProfileConfig based on MEMORY_PROFILE
spring.datasource.hikari.maximum-pool-size=${storesight.memory.${storesight.memory.profile:512MB}.db.pool.max-size:3}
spring.datasource.hikari.minimum-idle=${storesight.memory.${storesight.memory.profile:512MB}.db.pool.min-idle:1}
spring.datasource.hikari.connection-timeout=8000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000

# =============================================================================
# FLYWAY - Production safe settings
# =============================================================================
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# =============================================================================
# MANAGEMENT ENDPOINTS - Secure production settings
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# =============================================================================
# SERVER CONFIGURATION - Optimized for 2x512MB with CPU throttling
# =============================================================================
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.secure=true
server.servlet.session.http-only=true

# Tomcat optimization - Dynamic based on memory profile
server.tomcat.max-threads=${storesight.memory.${storesight.memory.profile:512MB}.tomcat.max-threads:15}
server.tomcat.max-connections=${storesight.memory.${storesight.memory.profile:512MB}.tomcat.max-connections:50}
server.tomcat.accept-count=10
server.tomcat.connection-timeout=8000
server.tomcat.keep-alive-timeout=10000
server.tomcat.max-keep-alive-requests=15
server.tomcat.max-http-form-post-size=256KB
server.tomcat.max-swallow-size=256KB
server.tomcat.async-timeout=8000

# =============================================================================
# APPLICATION STARTUP - Emergency memory optimization
# =============================================================================
spring.main.banner-mode=off
spring.output.ansi.enabled=never
spring.main.lazy-initialization=true
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# =============================================================================
# CACHE CONFIGURATION - Dynamic based on memory profile
# =============================================================================
spring.cache.caffeine.spec=maximumSize=${storesight.memory.${storesight.memory.profile:512MB}.cache.caffeine.max-size:100},expireAfterWrite=10m

# =============================================================================
# REDIS CONNECTION POOL - Dynamic based on memory profile
# =============================================================================
spring.data.redis.lettuce.pool.max-active=${storesight.memory.${storesight.memory.profile:512MB}.redis.pool.max-active:2}
spring.data.redis.lettuce.pool.max-idle=1
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=2s
spring.data.redis.timeout=3s

# =============================================================================
# JVM AND MEMORY OPTIMIZATION
# =============================================================================
# JPA batch processing - reduce CPU overhead and memory usage
spring.jpa.properties.hibernate.jdbc.batch_size=5
spring.jpa.properties.hibernate.order_inserts=false
spring.jpa.properties.hibernate.order_updates=false

# =============================================================================
# ASYNC PROCESSING LIMITS - Dynamic based on memory profile
# =============================================================================
async.processing.discovery.max-concurrent=${storesight.memory.${storesight.memory.profile:512MB}.async.discovery.max-concurrent:1}
async.processing.scraping.max-concurrent=${storesight.memory.${storesight.memory.profile:512MB}.async.scraping.max-concurrent:1}
async.processing.notification.max-concurrent=${storesight.memory.${storesight.memory.profile:512MB}.async.notification.max-concurrent:2}
async.processing.queue.capacity=${storesight.memory.${storesight.memory.profile:512MB}.async.queue.capacity:50}
async.processing.retry.max-attempts=2

# =============================================================================
# MONITORING INTERVALS - Staggered schedule to prevent resource contention
# =============================================================================
# CRITICAL: Staggered monitoring prevents overlap and resource spikes
# System Resources: 20M delay, Health Check: 3H30M delay (3.5 hour stagger)
# This prevents both services from running simultaneously every 6 hours
storesight.monitoring.system-resources-interval=PT6H
storesight.monitoring.system-resources-startup-delay=PT20M
storesight.monitoring.dashboard-collection-interval=PT8H
storesight.monitoring.dashboard-collection-startup-delay=PT25M
storesight.monitoring.health-check-interval=PT6H
storesight.monitoring.health-check-startup-delay=PT3H30M
storesight.monitoring.alerting-interval=PT12H
storesight.monitoring.alerting-startup-delay=PT35M
storesight.monitoring.sse-cleanup-interval=PT15M
storesight.monitoring.sse-cleanup-startup-delay=PT40M

# =============================================================================
# ADDITIONAL MONITORING OPTIMIZATIONS
# =============================================================================
# Disable non-essential monitoring for maximum reliability
storesight.monitoring.performance-metrics-interval=PT24H
storesight.monitoring.performance-metrics-startup-delay=PT45M
storesight.monitoring.database-interval=PT8H
storesight.monitoring.database-startup-delay=PT50M
storesight.monitoring.redis-interval=PT12H
storesight.monitoring.redis-startup-delay=PT55M

# Session cleanup optimization - less frequent for reliability
storesight.session.synchronization-cleanup-interval=PT4H
storesight.session.synchronization-cleanup-startup-delay=PT60M
storesight.session.stuck-markers-cleanup-interval=PT6H
storesight.session.stuck-markers-cleanup-startup-delay=PT65M
storesight.session.critical-stuck-markers-cleanup-interval=PT8H
storesight.session.critical-stuck-markers-cleanup-startup-delay=PT70M
storesight.session.expired-sessions-cleanup-interval=PT6H
storesight.session.expired-sessions-cleanup-startup-delay=PT75M
storesight.session.stale-sessions-cleanup-interval=PT8H
storesight.session.stale-sessions-cleanup-startup-delay=PT80M

# Cache optimization - minimal cleanup for reliability
storesight.cache.cleanup-interval=PT4H
storesight.cache.statistics-interval=PT12H

# Database performance analysis - nightly only
database.monitoring.analysis-interval-minutes=1440
database.monitoring.log-slow-queries=false

# Disable heavy metrics collection for reliability
management.metrics.enable.http=false
management.metrics.enable.tomcat=false
management.metrics.enable.hikaricp=false
management.metrics.enable.cache=false
management.metrics.enable.jdbc=false

# Keep only essential JVM metrics for monitoring dashboards
# Note: JVM metrics are already enabled above for monitoring dashboards

# Disable detailed health checks for performance
# Note: Health check settings are inherited from application.properties

# Reduce logging verbosity for monitoring services
logging.level.com.storesight.backend.service.SystemResourceMonitoringService=WARN
logging.level.com.storesight.backend.service.MonitoringDashboardService=WARN
logging.level.com.storesight.backend.service.AlertingService=WARN
logging.level.com.storesight.backend.service.PerformanceMetricsService=WARN

# =============================================================================
# CPU THRESHOLDS - Optimized for starter plan
# =============================================================================
# Balanced thresholds for 2-instance setup
alerting.cpu.warning.threshold=80
alerting.cpu.critical.threshold=95
alerting.memory.warning.threshold=80
alerting.memory.critical.threshold=95
alerting.disk.warning.threshold=85
alerting.disk.critical.threshold=95

# =============================================================================
# JVM METRICS - EMERGENCY MEMORY OPTIMIZATION
# =============================================================================
# Disable JVM metrics during startup to reduce memory pressure
management.metrics.export.prometheus.enabled=false
management.metrics.enable.jvm=false
management.metrics.enable.process=false
management.metrics.enable.system=false

# Additional memory optimization for startup
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=false

# =============================================================================
# FEATURE FLAGS - OPTIMIZED FOR 512MB RENDER STARTER PLAN
# =============================================================================
# Disable memory-intensive scheduled monitoring services by default
# These can be enabled on-demand via admin interface when needed
storesight.features.monitoring.scheduled-system-resource-monitoring=false
storesight.features.monitoring.scheduled-dashboard-collection=false
storesight.features.monitoring.scheduled-performance-metrics=false
storesight.features.monitoring.scheduled-database-monitoring=false
storesight.features.monitoring.scheduled-redis-monitoring=false
storesight.features.monitoring.scheduled-alerting=false
storesight.features.monitoring.scheduled-cache-cleanup=false
storesight.features.monitoring.scheduled-session-cleanup=false
storesight.features.monitoring.scheduled-sse-cleanup=false

# Disable SSE by default to reduce memory usage
# Can be enabled when needed for real-time notifications
storesight.features.sse.enabled=false

# Keep essential monitoring features enabled for admin dashboards
storesight.features.monitoring.enhanced-metrics=true
storesight.features.monitoring.performance-monitoring=true
storesight.features.monitoring.health-checks=true
storesight.features.monitoring.alerting=true
storesight.features.monitoring.resource-monitoring=true
storesight.features.monitoring.connection-pool-monitoring=true
storesight.features.monitoring.database-monitoring=true
storesight.features.monitoring.custom-metrics=true

# =============================================================================
# SECURITY - Production defaults
# =============================================================================
storesight.security.require-https=true
storesight.security.audit-logging=true
storesight.security.csrf-enabled=true

# =============================================================================
# MONITORING - Production environment tag
# =============================================================================
management.metrics.tags.environment=production

# =============================================================================
# MEMORY PROFILE CONFIGURATION - Feature Flag Based
# =============================================================================
# Set this to switch between memory profiles
# Options: 512MB, 1GB, 2GB
storesight.memory.profile=${MEMORY_PROFILE:512MB}

# =============================================================================
# RESOURCE LIMITS - Dynamic based on memory profile
# =============================================================================
# 512MB Profile (Emergency Mode)
storesight.memory.512mb.sse.max-connections-per-shop=3
storesight.memory.512mb.sse.max-connections-global=20
storesight.memory.512mb.cache.max-memory-cache-size=100
storesight.memory.512mb.async.discovery.max-concurrent=1
storesight.memory.512mb.async.scraping.max-concurrent=1
storesight.memory.512mb.async.notification.max-concurrent=2
storesight.memory.512mb.async.queue.capacity=50
storesight.memory.512mb.session.max-sessions-per-shop=5
storesight.memory.512mb.db.pool.max-size=3
storesight.memory.512mb.db.pool.min-idle=1
storesight.memory.512mb.tomcat.max-threads=15
storesight.memory.512mb.tomcat.max-connections=50
storesight.memory.512mb.redis.pool.max-active=2
storesight.memory.512mb.cache.caffeine.max-size=100
storesight.memory.512mb.request.throttling.enabled=true
storesight.memory.512mb.request.throttling.max-concurrent=2

# 1GB Profile (Balanced Mode)
storesight.memory.1gb.sse.max-connections-per-shop=5
storesight.memory.1gb.sse.max-connections-global=50
storesight.memory.1gb.cache.max-memory-cache-size=500
storesight.memory.1gb.async.discovery.max-concurrent=3
storesight.memory.1gb.async.scraping.max-concurrent=5
storesight.memory.1gb.async.notification.max-concurrent=10
storesight.memory.1gb.async.queue.capacity=1000
storesight.memory.1gb.session.max-sessions-per-shop=10
storesight.memory.1gb.db.pool.max-size=8
storesight.memory.1gb.db.pool.min-idle=3
storesight.memory.1gb.tomcat.max-threads=50
storesight.memory.1gb.tomcat.max-connections=200
storesight.memory.1gb.redis.pool.max-active=5
storesight.memory.1gb.cache.caffeine.max-size=500
storesight.memory.1gb.request.throttling.enabled=false
storesight.memory.1gb.request.throttling.max-concurrent=10

# 2GB Profile (Performance Mode)
storesight.memory.2gb.sse.max-connections-per-shop=10
storesight.memory.2gb.sse.max-connections-global=100
storesight.memory.2gb.cache.max-memory-cache-size=1000
storesight.memory.2gb.async.discovery.max-concurrent=5
storesight.memory.2gb.async.scraping.max-concurrent=10
storesight.memory.2gb.async.notification.max-concurrent=20
storesight.memory.2gb.async.queue.capacity=2000
storesight.memory.2gb.session.max-sessions-per-shop=20
storesight.memory.2gb.db.pool.max-size=15
storesight.memory.2gb.db.pool.min-idle=5
storesight.memory.2gb.tomcat.max-threads=100
storesight.memory.2gb.tomcat.max-connections=500
storesight.memory.2gb.redis.pool.max-active=10
storesight.memory.2gb.cache.caffeine.max-size=1000
storesight.memory.2gb.request.throttling.enabled=false
storesight.memory.2gb.request.throttling.max-concurrent=20

# =============================================================================
# DISCOVERY LIMITS - Production safe
# =============================================================================
storesight.discovery.max-concurrent-requests=3
competitor.scraping.max-concurrent-scrapers=3

# =============================================================================
# REDIS CONNECTION POOL - Optimized for 2 instances
# =============================================================================
# Note: Redis pool settings are inherited from application.properties
# Override only if needed for 2-instance optimization

# =============================================================================
# TOMCAT THREADS - Optimized for 2 instances
# =============================================================================
# Note: Tomcat settings are inherited from application.properties
# Override only if needed for 2-instance optimization

