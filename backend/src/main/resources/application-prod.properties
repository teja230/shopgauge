# Production-specific configuration
# This file OVERRIDES selected properties from application.properties for production
# Most configurations are inherited from application.properties - only production-specific changes here

# =============================================================================
# LOGGING CONFIGURATION - Reduce startup noise only
# =============================================================================
logging.level.org.springframework=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.context=WARN
logging.level.org.springframework.beans=WARN
logging.level.org.springframework.core=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.storesight=INFO

# Disable SQL logging in production for performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# DATABASE CONNECTION POOL - Production optimized for Render Hobby plan (512MB)
# =============================================================================
# CURRENT SETTINGS: Optimized for 512MB memory limit
# When upgrading to higher Render plan (1GB+), change to:
# spring.datasource.hikari.maximum-pool-size=20
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.connection-timeout=20000
# spring.datasource.hikari.leak-detection-threshold=60000
# spring.datasource.hikari.validation-timeout=5000
# spring.datasource.hikari.idle-timeout=600000
# spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# =============================================================================
# FLYWAY - Production safe settings
# =============================================================================
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# =============================================================================
# MANAGEMENT ENDPOINTS - Secure production settings
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# =============================================================================
# SERVER CONFIGURATION - Production security and memory optimization
# =============================================================================
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.servlet.session.secure=true
server.servlet.session.http-only=true

# Tomcat optimization for 512MB memory limit
server.tomcat.max-threads=50
server.tomcat.max-connections=200
server.tomcat.accept-count=50
server.tomcat.connection-timeout=15000
server.tomcat.keep-alive-timeout=30000
server.tomcat.max-keep-alive-requests=50
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
server.tomcat.async-timeout=15000

# =============================================================================
# APPLICATION STARTUP - Reduce noise
# =============================================================================
spring.main.banner-mode=off
spring.output.ansi.enabled=never

# =============================================================================
# CACHE CONFIGURATION - Production optimized for 512MB memory
# =============================================================================
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30m

# =============================================================================
# REDIS CONNECTION POOL - Optimized for 512MB memory
# =============================================================================
# CURRENT SETTINGS: Optimized for 512MB memory limit
# When upgrading to higher Render plan (1GB+), change to:
# spring.data.redis.lettuce.pool.max-active=8
# spring.data.redis.lettuce.pool.max-idle=6
# spring.data.redis.lettuce.pool.min-idle=2
# spring.data.redis.lettuce.pool.max-wait=2s
# spring.data.redis.timeout=5s
spring.data.redis.lettuce.pool.max-active=4
spring.data.redis.lettuce.pool.max-idle=2
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=1s
spring.data.redis.timeout=3s

# =============================================================================
# SECURITY - Production defaults
# =============================================================================
storesight.security.require-https=true
storesight.security.audit-logging=true
storesight.security.csrf-enabled=true

# =============================================================================
# MONITORING - Production environment tag
# =============================================================================
management.metrics.tags.environment=production

# =============================================================================
# RESOURCE LIMITS - Optimized for Render Hobby plan (512MB)
# =============================================================================
# CURRENT SETTINGS: Optimized for 512MB memory limit
# When upgrading to higher Render plan (1GB+), change to:
# storesight.sse.max-connections-per-shop=5
# storesight.sse.max-connections-global=50
# async.processing.discovery.max-concurrent=3
# async.processing.scraping.max-concurrent=5
# async.processing.notification.max-concurrent=10
# async.processing.queue.capacity=1000
storesight.sse.max-connections-per-shop=3
storesight.sse.max-connections-global=20
async.processing.discovery.max-concurrent=2
async.processing.scraping.max-concurrent=3
async.processing.notification.max-concurrent=5
async.processing.queue.capacity=500
storesight.cache.max-memory-cache-size=1000
storesight.monitoring.memory-warning-threshold=80
storesight.monitoring.memory-critical-threshold=95

# =============================================================================
# DISCOVERY LIMITS - Production safe
# =============================================================================
storesight.discovery.max-concurrent-requests=3
competitor.scraping.max-concurrent-scrapers=3

# =============================================================================
# SESSION LIMITS - Production optimized
# =============================================================================
storesight.session.max-sessions-per-shop=5

# Note: All other configurations from application.properties are inherited
# This includes all the essential configurations for:
# - Redis configuration
# - Shopify API settings
# - SendGrid/Twilio settings
# - All the storesight.* feature flags and configurations
# - Database monitoring settings
# - SSE configuration
# - Cache configuration
# - Security settings
# - Discovery settings
# - Session management
# - Monitoring and alerting
# - Feature flags
