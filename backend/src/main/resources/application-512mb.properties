# 512MB Memory Profile Configuration for Market Intelligence Optimization
# Optimized for Render instances with 512MB RAM and 0.5 CPU constraints

# ========================================
# JVM Memory Settings (External Configuration)
# ========================================
# These should be set in Render environment variables:
# JAVA_OPTS=-Xms128m -Xmx384m -XX:NewRatio=1 -XX:SurvivorRatio=8 -XX:+UseG1GC -XX:MaxGCPauseMillis=100

# ========================================
# Market Intelligence Cache Configuration
# ========================================
# Enable Market Intelligence caching with conservative settings
storesight.cache.market-intelligence.enabled=true

# Cache TTL settings optimized for 512MB
storesight.cache.market-intelligence.dashboard-ttl=PT30M
storesight.cache.market-intelligence.cost-analytics-ttl=PT2H
storesight.cache.market-intelligence.discovery-stats-ttl=PT1H
storesight.cache.market-intelligence.provider-stats-ttl=PT15M
storesight.cache.market-intelligence.competitor-data-ttl=PT4H
storesight.cache.market-intelligence.price-history-ttl=PT6H
storesight.cache.market-intelligence.performance-metrics-ttl=PT10M
storesight.cache.market-intelligence.system-status-ttl=PT5M

# Cache size limits for 512MB profile
storesight.cache.market-intelligence.max-entries=1000
storesight.cache.market-intelligence.max-memory-mb=32

# ========================================
# Redis Configuration for 512MB
# ========================================
# Redis memory optimization
spring.redis.jedis.pool.max-active=3
spring.redis.jedis.pool.max-idle=2
spring.redis.jedis.pool.min-idle=1
spring.redis.jedis.pool.max-wait=1000ms
spring.redis.timeout=2000ms

# Redis cache configuration
storesight.redis.max-memory=64MB
storesight.redis.eviction-policy=allkeys-lru
storesight.redis.compression.enabled=true
storesight.redis.serialization=json

# ========================================
# Batch Processing Configuration
# ========================================
# Batch processing optimized for 512MB
storesight.batch.processing.enabled=true
storesight.batch.processing.interval=PT10M
storesight.batch.processing.max-concurrent=1
storesight.batch.processing.batch-size=10
storesight.batch.processing.queue-size-threshold=50
storesight.batch.processing.memory-threshold=70

# Write operations configuration
storesight.write.operations.enabled=true
storesight.write.operations.write-through-cache=true
storesight.write.operations.batch-enabled=true
storesight.write.operations.async-enabled=true

# ========================================
# Cache Warming Configuration
# ========================================
# Cache warming optimized for 512MB
storesight.cache.warming.enabled=true
storesight.cache.warming.schedule=0 */30 * * * *
storesight.cache.warming.max.concurrent=2
storesight.cache.warming.memory-threshold=70
storesight.cache.warming.priority-levels=CRITICAL,HIGH

# ========================================
# Database Configuration for 512MB
# ========================================
# Connection pool settings
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# Database query optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ========================================
# Materialized Views Configuration
# ========================================
# Materialized view refresh settings
storesight.materialized-views.enabled=true
storesight.materialized-views.refresh.cost-summary=0 2 * * *
storesight.materialized-views.refresh.competitor-performance=0 */4 * * *
storesight.materialized-views.refresh.price-trends=0 */2 * * *
storesight.materialized-views.refresh.system-performance=0 * * * *

# ========================================
# Thread Pool Configuration
# ========================================
# Async task execution
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=10
spring.task.execution.pool.keep-alive=60s

# Scheduled task execution
spring.task.scheduling.pool.size=2

# ========================================
# HTTP Configuration for 512MB
# ========================================
# HTTP request limits
server.max-http-header-size=8KB
server.max-http-post-size=1MB
server.tomcat.max-connections=50
server.tomcat.max-threads=10
server.tomcat.min-spare-threads=2
server.tomcat.accept-count=10

# ========================================
# Logging Configuration for 512MB
# ========================================
# Conservative logging to reduce memory usage
logging.level.com.storesight.backend.service.MarketIntelligenceCacheService=INFO
logging.level.com.storesight.backend.service.MarketIntelligenceBatchService=INFO
logging.level.com.storesight.backend.service.MarketIntelligenceWriteService=INFO
logging.level.com.storesight.backend.service.MarketIntelligenceEventHandler=INFO
logging.level.com.storesight.backend.service.MarketIntelligenceCacheWarmingService=INFO

# Reduce SQL logging in production
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ========================================
# External API Configuration
# ========================================
# Rate limiting for external APIs
storesight.external.api.rate-limit.enabled=true
storesight.external.api.rate-limit.requests-per-minute=30
storesight.external.api.rate-limit.burst-capacity=10

# API timeouts optimized for 512MB
storesight.external.api.timeout.connect=5000
storesight.external.api.timeout.read=10000
storesight.external.api.timeout.write=5000

# Circuit breaker configuration
storesight.circuit-breaker.enabled=true
storesight.circuit-breaker.failure-threshold=5
storesight.circuit-breaker.recovery-timeout=30000
storesight.circuit-breaker.half-open-max-calls=3

# ========================================
# Cost Optimization Integration
# ========================================
# Cost tracking optimized for 512MB
storesight.cost.optimization.enabled=true
storesight.cost.optimization.cache-ttl=PT24H
storesight.cost.optimization.max-daily-cost=50.00
storesight.cost.optimization.max-monthly-cost=1500.00
storesight.cost.optimization.alert-threshold=80

# ========================================
# Monitoring and Health Checks
# ========================================
# Health check configuration
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.cache.time-to-live=30s

# Metrics configuration
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.tomcat=true

# Custom metrics for Market Intelligence
storesight.metrics.market-intelligence.enabled=true
storesight.metrics.market-intelligence.export-interval=PT5M

# ========================================
# Security Configuration for 512MB
# ========================================
# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# ========================================
# Development and Debug Settings
# ========================================
# Debug settings (disabled in production)
storesight.debug.enabled=false
storesight.debug.cache.log-operations=false
storesight.debug.batch.log-operations=false
storesight.debug.memory.log-usage=false

# ========================================
# Feature Flags for Gradual Rollout
# ========================================
# Market Intelligence feature flags
storesight.feature.market-intelligence.cache-enabled=true
storesight.feature.market-intelligence.batch-enabled=true
storesight.feature.market-intelligence.warming-enabled=true
storesight.feature.market-intelligence.materialized-views-enabled=true
storesight.feature.market-intelligence.write-through-enabled=true
storesight.feature.market-intelligence.event-driven-invalidation=true

# Gradual rollout settings
storesight.rollout.market-intelligence.percentage=100
storesight.rollout.market-intelligence.shops=all

# ========================================
# Render Platform Specific Settings
# ========================================
# Render optimization
storesight.render.optimized=true
storesight.render.memory-profile=512MB
storesight.render.cpu-profile=0.5
storesight.render.startup-probe-delay=60s
storesight.render.liveness-probe-delay=90s

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s