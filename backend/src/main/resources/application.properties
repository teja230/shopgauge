spring.application.name=storesight-backend
# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/storesight}
spring.datasource.username=${DB_USER:storesight}
spring.datasource.password=${DB_PASS:storesight}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration - Optimized for Production
# Use environment variables with fallback defaults
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION:15000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT:3000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}

# CRITICAL: Production overrides to prevent connection leaks
# These settings will be overridden by application-prod.properties
spring.datasource.hikari.pool-name=MainHikariCP
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

# PostgreSQL-specific optimizations
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.ApplicationName=StoresightApp

# Custom Database Configuration - COMPLETELY DISABLED TO FIX JPA CONFLICTS
storesight.database.custom-config.enabled=${CUSTOM_DB_CONFIG_ENABLED:false}

# JPA/Hibernate Configuration - FIXED FOR SPRING BOOT 3.X COMPATIBILITY
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# REMOVED: PostgreSQL dialect auto-detected by Hibernate
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database=postgresql
# PERFORMANCE: Disable open-in-view for better performance in APIs
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.release_mode=after_transaction
spring.jpa.properties.jakarta.persistence.query.timeout=10000

# Transaction Configuration - CRITICAL FOR PREVENTING CONNECTION LEAKS
spring.transaction.default-timeout=30s

# Connection Pool Health and Monitoring

# Database performance optimizations (extended from above)
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.useLocalTransactionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false

# Redis Configuration with Connection Pooling - OPTIMIZED
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Redis Connection Pooling for Better Performance
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=6
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2s
spring.data.redis.timeout=5s

# Flyway - ENHANCED CONFIGURATION FOR CONNECTION LEAK PREVENTION
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# CRITICAL: Connection management settings to prevent leaks
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=5
spring.flyway.lock-retry-count=50
# CRITICAL: Prevent connection leaks during migrations
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.ignore-missing-migrations=false
spring.flyway.ignore-ignored-migrations=false
spring.flyway.ignore-pending-migrations=false
spring.flyway.ignore-future-migrations=false
# CRITICAL: Ensure proper connection cleanup and handle mixed migrations
spring.flyway.mixed=false
spring.flyway.group=true
spring.flyway.installed-by=storesight-backend
# Handle existing index warnings gracefully
spring.flyway.ignore-migration-patterns=*:missing,*:ignored

# Custom Flyway Configuration - DISABLED TO PREVENT JPA CONFLICTS
storesight.flyway.custom.enabled=${CUSTOM_FLYWAY_ENABLED:false}

# SendGrid
sendgrid.api-key=${SENDGRID_API_KEY:dummy_sendgrid_key}
# Twilio
twilio.account_sid=${TWILIO_ACCOUNT_SID:dummy_twilio_sid}
twilio.auth_token=${TWILIO_AUTH_TOKEN:dummy_twilio_token}
twilio.from_number=${TWILIO_FROM_NUMBER:+1234567890}
# Shopify
shopify.api.key=${SHOPIFY_API_KEY:}
shopify.api.secret=${SHOPIFY_API_SECRET:}
shopify.api.version=${SHOPIFY_API_VERSION:2023-10}
shopify.admin.base-url=${SHOPIFY_ADMIN_BASE_URL:https://{shop}.myshopify.com/admin}
shopify.scopes=read_products,read_orders,read_customers,read_inventory
shopify.redirect_uri=${SHOPIFY_REDIRECT_URI:https://api.shopgaugeai.com/api/auth/shopify/callback}
# Frontend URL for redirects after authentication
frontend.url=${FRONTEND_URL:http://localhost:5173}
# Logging
logging.level.org.springframework=INFO
logging.level.com.storesight=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Server
server.port=${SERVER_PORT:8080}
# Backend URL Configuration
backend.url=${BACKEND_URL:http://localhost:8080}
# Competitor Discovery
discovery.serpapi.key=${SERPAPI_KEY:dummy_serpapi_key}
discovery.serpapi.base-url=${SERPAPI_BASE_URL:https://serpapi.com/search.json}
discovery.serpapi.max-results=${SERPAPI_MAX_RESULTS:3}

# Scrapingdog API (Primary - Most Cost-Effective)
discovery.scrapingdog.key=${SCRAPINGDOG_KEY:dummy_scrapingdog_key}
discovery.scrapingdog.base-url=${SCRAPINGDOG_BASE_URL:https://api.scrapingdog.com/google}
discovery.scrapingdog.max-results=${SCRAPINGDOG_MAX_RESULTS:10}

# Serper API (Secondary - Fast Fallback)
discovery.serper.key=${SERPER_KEY:dummy_serper_key}
discovery.serper.base-url=${SERPER_BASE_URL:https://google.serper.dev/search}
discovery.serper.max-results=${SERPER_MAX_RESULTS:10}

# Multi-Source Settings
discovery.multi-source.enabled=${DISCOVERY_MULTI_SOURCE_ENABLED:true}
discovery.multi-source.fallback-enabled=${DISCOVERY_FALLBACK_ENABLED:true}
discovery.multi-source.max-providers=${DISCOVERY_MAX_PROVIDERS:3}

# Legacy settings (still supported)
discovery.provider=${DISCOVERY_PROVIDER:multi-source}
discovery.enabled=${DISCOVERY_ENABLED:true}
discovery.interval.hours=${DISCOVERY_INTERVAL_HOURS:24}
discovery.max.results=${DISCOVERY_MAX_RESULTS:10}

# Caching Configuration - Extended cache times for cost optimization
spring.cache.cache-names=searchResults,suggestionCounts
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=120m

# Redis secret: serpapi.api.key
# --- Spring Session configuration ---
spring.session.store-type=redis
spring.session.timeout=4h
spring.session.redis.namespace=storesight:sessions
spring.session.redis.flush-mode=on-save
spring.session.redis.save-mode=on-set-attribute
# Use default Redis repository type instead of indexed to avoid keyspace notifications
spring.session.redis.repository-type=default
# Configure JSON serialization for both Spring Session and general Redis operations
spring.data.redis.default-type=json
spring.session.redis.serializer=json
# Disable Redis repository scanning since we only use JPA repositories
spring.data.redis.repositories.enabled=false
# Notification Cleanup Policy Configuration
notifications.cleanup.enabled=true
notifications.cleanup.retention-days=30
notifications.cleanup.batch-size=100
notifications.cleanup.max-read-notifications=50
notifications.cleanup.max-unread-notifications=100

# Monitoring and Alerting Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.db.enabled=true

# HTTP Session Configuration
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=4h

# HTTP Async Processing Configuration - Fix for async processing errors
server.tomcat.max-threads=200
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
server.tomcat.async-timeout=30000

# Admin authentication configuration
# These can be set via environment variables or application properties
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}
admin.jwt.secret=${JWT_SECRET:}
admin.jwt.secret.fallback=${ADMIN_JWT_SECRET:}

# Admin Authentication Configuration
admin.auth.enabled=${ADMIN_AUTH_ENABLED:true}
admin.auth.session-timeout=${ADMIN_SESSION_TIMEOUT:3600}
admin.auth.max-login-attempts=${ADMIN_MAX_LOGIN_ATTEMPTS:5}
admin.auth.lockout-duration=${ADMIN_LOCKOUT_DURATION:900}
admin.auth.token-expiry=${ADMIN_TOKEN_EXPIRY:86400}
admin.auth.require-https=${ADMIN_REQUIRE_HTTPS:true}
admin.auth.audit-logging=${ADMIN_AUDIT_LOGGING:true}

# Admin Security Headers
admin.security.csrf-enabled=${ADMIN_CSRF_ENABLED:true}
admin.security.xss-protection=${ADMIN_XSS_PROTECTION:true}
admin.security.content-security-policy=${ADMIN_CSP:true}
