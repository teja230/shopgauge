spring.application.name=storesight-backend
# Circular references are not allowed - services must be properly designed
# spring.main.allow-circular-references=false
# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/storesight}
spring.datasource.username=${DB_USER:storesight}
spring.datasource.password=${DB_PASS:storesight}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration - Optimized for Production
# Use environment variables with fallback defaults
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION:15000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT:3000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}

# CRITICAL: Production overrides to prevent connection leaks
# These settings will be overridden by application-prod.properties
spring.datasource.hikari.pool-name=MainHikariCP
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

# PostgreSQL-specific optimizations
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.ApplicationName=StoresightApp

# Custom Database Configuration - COMPLETELY DISABLED TO FIX JPA CONFLICTS
storesight.database.custom-config.enabled=${CUSTOM_DB_CONFIG_ENABLED:false}

# JPA/Hibernate Configuration - FIXED FOR SPRING BOOT 3.X COMPATIBILITY
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# REMOVED: PostgreSQL dialect auto-detected by Hibernate
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database=postgresql
# PERFORMANCE: Disable open-in-view for better performance in APIs
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.release_mode=after_transaction
spring.jpa.properties.jakarta.persistence.query.timeout=10000

# Transaction Configuration - CRITICAL FOR PREVENTING CONNECTION LEAKS
spring.transaction.default-timeout=30s

# Connection Pool Health and Monitoring

# Database performance optimizations (extended from above)
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.useLocalTransactionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false

# Enhanced Database Configuration
storesight.database.enhanced-config.enabled=${DB_ENHANCED_CONFIG_ENABLED:true}

# Database Monitoring Configuration - NIGHTLY SCHEDULE
database.monitoring.enabled=${DB_MONITORING_ENABLED:true}
database.monitoring.slow-query-threshold=${DB_SLOW_QUERY_THRESHOLD:5000}
database.monitoring.analysis-interval-minutes=${DB_ANALYSIS_INTERVAL_MINUTES:1440}
database.monitoring.log-slow-queries=${DB_LOG_SLOW_QUERIES:false}

# Database Optimization Configuration - MEMORY OPTIMIZED
database.optimization.prepared-statement-cache-size=${DB_PREP_STMT_CACHE_SIZE:100}
database.optimization.batch-size=${DB_BATCH_SIZE:10}

# Async Processing Configuration - MEMORY OPTIMIZED
async.processing.discovery.max-concurrent=${ASYNC_DISCOVERY_MAX_CONCURRENT:2}
async.processing.scraping.max-concurrent=${ASYNC_SCRAPING_MAX_CONCURRENT:3}
async.processing.notification.max-concurrent=${ASYNC_NOTIFICATION_MAX_CONCURRENT:5}
async.processing.queue.capacity=${ASYNC_QUEUE_CAPACITY:500}
async.processing.retry.max-attempts=${ASYNC_RETRY_MAX_ATTEMPTS:3}
async.processing.retry.delay-seconds=${ASYNC_RETRY_DELAY_SECONDS:5}
async.processing.timeout.discovery-minutes=${ASYNC_DISCOVERY_TIMEOUT_MINUTES:10}
async.processing.timeout.scraping-minutes=${ASYNC_SCRAPING_TIMEOUT_MINUTES:5}
async.processing.timeout.notification-seconds=${ASYNC_NOTIFICATION_TIMEOUT_SECONDS:30}

# Price Refresh Queue Configuration - SCALABLE EVENT-DRIVEN PROCESSING
# Enable/disable price refresh functionality
price.refresh.enabled=${PRICE_REFRESH_ENABLED:true}

price.refresh.max-concurrent-domains=${PRICE_REFRESH_MAX_CONCURRENT_DOMAINS:2}
price.refresh.batch-size=${PRICE_REFRESH_BATCH_SIZE:3}
price.refresh.progress-update-interval=${PRICE_REFRESH_PROGRESS_UPDATE_INTERVAL:10}

# Memory-Efficient Thread Pool Configuration
price.refresh.thread-pool.core-size=${PRICE_REFRESH_CORE_THREADS:2}
price.refresh.thread-pool.max-size=${PRICE_REFRESH_MAX_THREADS:3}
price.refresh.thread-pool.queue-capacity=${PRICE_REFRESH_QUEUE_CAPACITY:10}

# Session Management Optimization
price.refresh.session-cleanup-interval=${PRICE_REFRESH_SESSION_CLEANUP:300}
price.refresh.session-max-age=${PRICE_REFRESH_SESSION_MAX_AGE:1800}

# Memory-Efficient Caching
price.refresh.cache.enabled=${PRICE_REFRESH_CACHE_ENABLED:true}
price.refresh.cache.max-size=${PRICE_REFRESH_CACHE_MAX_SIZE:50}
price.refresh.cache.ttl=${PRICE_REFRESH_CACHE_TTL:3600}

# Resource Monitoring
price.refresh.memory-monitoring.enabled=${PRICE_REFRESH_MEMORY_MONITORING:true}
price.refresh.memory-threshold=${PRICE_REFRESH_MEMORY_THRESHOLD:85}

# Graceful Degradation
price.refresh.fallback.enabled=${PRICE_REFRESH_FALLBACK:true}
price.refresh.fallback.memory-threshold=${PRICE_REFRESH_FALLBACK_MEMORY:90}

# Redis-based Queue Configuration
price.refresh.redis.enabled=${PRICE_REFRESH_REDIS_ENABLED:true}
price.refresh.redis.key-prefix=${PRICE_REFRESH_REDIS_KEY_PREFIX:price_refresh}
price.refresh.redis.ttl=${PRICE_REFRESH_REDIS_TTL:3600}

# Redis Configuration with Connection Pooling - OPTIMIZED FOR MEMORY
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Redis Connection Pooling - REDUCED FOR MEMORY OPTIMIZATION
spring.data.redis.lettuce.pool.max-active=4
spring.data.redis.lettuce.pool.max-idle=2
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=1s
spring.data.redis.timeout=3s

# Redis Memory Optimization
spring.data.redis.lettuce.pool.time-between-eviction-runs=30s
spring.data.redis.lettuce.pool.min-evictable-idle-time=60s
spring.data.redis.lettuce.pool.num-tests-per-eviction-run=3

# Flyway - ENHANCED CONFIGURATION FOR CONNECTION LEAK PREVENTION
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# CRITICAL: Connection management settings to prevent leaks
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=5
spring.flyway.lock-retry-count=50
# CRITICAL: Prevent connection leaks during migrations
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.ignore-missing-migrations=false
spring.flyway.ignore-ignored-migrations=false
spring.flyway.ignore-pending-migrations=false
spring.flyway.ignore-future-migrations=false
# CRITICAL: Ensure proper connection cleanup and handle mixed migrations
spring.flyway.mixed=true
spring.flyway.group=true
# CRITICAL: Disable transactions for CONCURRENTLY index creation
spring.flyway.transaction-mode=auto
spring.flyway.installed-by=storesight-backend
# Handle existing index warnings gracefully
spring.flyway.ignore-migration-patterns=*:missing,*:ignored

# Custom Flyway Configuration - DISABLED TO PREVENT JPA CONFLICTS
storesight.flyway.custom.enabled=${CUSTOM_FLYWAY_ENABLED:false}

# SendGrid
sendgrid.api-key=${SENDGRID_API_KEY:dummy_sendgrid_key}
# Twilio
twilio.account_sid=${TWILIO_ACCOUNT_SID:dummy_twilio_sid}
twilio.auth_token=${TWILIO_AUTH_TOKEN:dummy_twilio_token}
twilio.from_number=${TWILIO_FROM_NUMBER:+1234567890}
# Shopify
shopify.api.key=${SHOPIFY_API_KEY:}
shopify.api.secret=${SHOPIFY_API_SECRET:}
shopify.api.version=${SHOPIFY_API_VERSION:2023-10}
shopify.admin.base-url=${SHOPIFY_ADMIN_BASE_URL:https://{shop}.myshopify.com/admin}
shopify.scopes=read_products,read_orders,read_customers,read_inventory
shopify.redirect_uri=${SHOPIFY_REDIRECT_URI:https://api.shopgaugeai.com/api/auth/shopify/callback}
# Frontend URL for redirects after authentication
frontend.url=${FRONTEND_URL:http://localhost:5173}
# Health Check Configuration (Conservative Settings)
health.database.monitoring.interval=300000
health.redis.monitoring.interval=300000
health.database.connection.timeout=5000
health.redis.connection.timeout=3000

# Logging - REDUCED FOR PERFORMANCE
logging.level.org.springframework=WARN
logging.level.com.storesight=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
# Server
# Bind to Render's dynamic PORT if available, otherwise fall back to SERVER_PORT or 8080
server.port=${PORT:${SERVER_PORT:8080}}
# Backend URL Configuration
backend.url=${BACKEND_URL:http://localhost:8080}
# Competitor Discovery
discovery.serpapi.key=${SERPAPI_KEY:dummy_serpapi_key}
discovery.serpapi.base-url=${SERPAPI_BASE_URL:https://serpapi.com/search.json}
discovery.serpapi.max-results=${SERPAPI_MAX_RESULTS:3}
discovery.serpapi.enabled=${SERPAPI_ENABLED:true}

# Scrapingdog API (Primary - Most Cost-Effective)
discovery.scrapingdog.key=${SCRAPINGDOG_KEY:dummy_scrapingdog_key}
discovery.scrapingdog.base-url=${SCRAPINGDOG_BASE_URL:https://api.scrapingdog.com/google}
discovery.scrapingdog.max-results=${SCRAPINGDOG_MAX_RESULTS:10}
discovery.scrapingdog.enabled=${SCRAPINGDOG_ENABLED:true}

# Serper API (Secondary - Fast Fallback)
discovery.serper.key=${SERPER_KEY:dummy_serper_key}
discovery.serper.base-url=${SERPER_BASE_URL:https://google.serper.dev/search}
discovery.serper.max-results=${SERPER_MAX_RESULTS:10}
discovery.serper.enabled=${SERPER_ENABLED:true}

# Price Scraping Configuration - OPTIMIZED FOR $19.99 PLAN
price.scraping.enabled=true
price.scraping.max-retries=1
price.scraping.timeout-seconds=30
price.scraping.rate-limit-delay-ms=2000
price.scraping.api-optimized=true
price.scraping.max-error-count=2
price.scraping.schedule-interval-hours=24
price.scraping.free-first=true
price.scraping.api-fallback-only=true

# Price Scraping API Endpoints (Separate from Discovery)
price.scraping.scrapingdog.base-url=${PRICE_SCRAPING_SCRAPINGDOG_BASE_URL:https://api.scrapingdog.com/google}
price.scraping.serper.base-url=${PRICE_SCRAPING_SERPER_BASE_URL:https://google.serper.dev/search}
price.scraping.serpapi.base-url=${PRICE_SCRAPING_SERPAPI_BASE_URL:https://serpapi.com/search.json}

# Multi-Source Settings
discovery.multi-source.enabled=${DISCOVERY_MULTI_SOURCE_ENABLED:true}
discovery.multi-source.fallback-enabled=${DISCOVERY_FALLBACK_ENABLED:true}
discovery.multi-source.max-providers=${DISCOVERY_MAX_PROVIDERS:3}

# Legacy settings (still supported)
discovery.provider=${DISCOVERY_PROVIDER:multi-source}
discovery.enabled=${DISCOVERY_ENABLED:true}
discovery.interval.hours=${DISCOVERY_INTERVAL_HOURS:24}
discovery.max.results=${DISCOVERY_MAX_RESULTS:10}

# Competitor Tracking Limits - Current single-plan structure with future expansion ready
competitor.limits.current-plan=${COMPETITOR_CURRENT_PLAN_LIMIT:10}
competitor.limits.basic-tier=${COMPETITOR_BASIC_TIER_LIMIT:25}
competitor.limits.premium-tier=${COMPETITOR_PREMIUM_TIER_LIMIT:100}
competitor.limits.enterprise-tier=${COMPETITOR_ENTERPRISE_TIER_LIMIT:500}

# Discovery limits to prevent API abuse
competitor.discovery.max-suggestions-per-product=${COMPETITOR_MAX_SUGGESTIONS_PER_PRODUCT:5}
competitor.discovery.max-products-per-shop=${COMPETITOR_MAX_PRODUCTS_PER_SHOP:50}
competitor.discovery.max-total-suggestions=${COMPETITOR_MAX_TOTAL_SUGGESTIONS:200}

# Scraping limits to prevent resource exhaustion - COST OPTIMIZED
competitor.scraping.max-urls-per-shop=${COMPETITOR_MAX_URLS_PER_SHOP:10}
competitor.scraping.max-concurrent-scrapers=${COMPETITOR_MAX_CONCURRENT_SCRAPERS:2}

# Product-aware keyword generation configuration
keyword.generation.max-products=${KEYWORD_MAX_PRODUCTS:20}
keyword.generation.cache-ttl-minutes=${KEYWORD_CACHE_TTL_MINUTES:30}
keyword.generation.min-keyword-frequency=${KEYWORD_MIN_FREQUENCY:2}

# Caching Configuration - MEMORY OPTIMIZED
spring.cache.cache-names=searchResults,suggestionCounts
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60m

# JVM Memory Optimization
spring.jvm.memory.initial-heap-size=256m
spring.jvm.memory.max-heap-size=512m
spring.jvm.memory.gc-type=G1GC
spring.jvm.memory.gc-optimization=true

# Redis secret: serpapi.api.key
# --- Spring Session configuration ---
spring.session.store-type=redis
spring.session.timeout=4h
spring.session.redis.namespace=storesight:sessions
spring.session.redis.flush-mode=on-save
spring.session.redis.save-mode=on-set-attribute
# Use default Redis repository type instead of indexed to avoid keyspace notifications
spring.session.redis.repository-type=default
# Configure JSON serialization for both Spring Session and general Redis operations
spring.data.redis.default-type=json
spring.session.redis.serializer=json
# Disable Redis repository scanning since we only use JPA repositories
spring.data.redis.repositories.enabled=false
# Notification Cleanup Policy Configuration
notifications.cleanup.enabled=true
notifications.cleanup.retention-days=30
notifications.cleanup.batch-size=100
notifications.cleanup.max-read-notifications=50
notifications.cleanup.max-unread-notifications=100

# Monitoring and Alerting Configuration - Enhanced
management.endpoints.web.exposure.include=health,info,metrics,prometheus,httptrace,threaddump,heapdump,env,configprops,beans,mappings,scheduledtasks,caches,conditions,flyway,liquibase,sessions,shutdown
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.endpoint.health.group.liveness.include=ping,diskSpace
management.endpoint.health.group.readiness.include=db,redis
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Metrics Configuration - Enhanced
management.metrics.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s,2s
management.metrics.tags.application=storesight-backend
management.metrics.tags.environment=${ENVIRONMENT:development}

# JVM Metrics - DISABLED DURING STARTUP TO REDUCE RESOURCE CONTENTION
management.metrics.enable.jvm=false
management.metrics.enable.system=false
management.metrics.enable.process=false
management.metrics.enable.http=true
management.metrics.enable.tomcat=true
management.metrics.enable.hikaricp=true
management.metrics.enable.cache=true
management.metrics.enable.jdbc=true

# Custom Application Metrics
management.metrics.enable.application.session=true
management.metrics.enable.application.sse=true
management.metrics.enable.application.cache=true
management.metrics.enable.application.database=true

