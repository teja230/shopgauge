storesight.features.security.security-headers=${FEATURE_SECURITY_HEADERS:true}

# Discovery Features
storesight.features.discovery.multi-source-discovery=${FEATURE_DISCOVERY_MULTI_SOURCE_DISCOVERY:true}
storesight.features.discovery.cache-optimization=${FEATURE_DISCOVERY_CACHE_OPTIMIZATION:true}
storesight.features.discovery.rate-limiting=${FEATURE_DISCOVERY_RATE_LIMITING:true}
storesight.features.discovery.keyword-generation=${FEATURE_DISCOVERY_KEYWORD_GENERATION:true}
storesight.features.discovery.product-aware-discovery=${FEATURE_DISCOVERY_PRODUCT_AWARE_DISCOVERY:true}
storesight.features.discovery.fallback-mechanisms=${FEATURE_DISCOVERY_FALLBACK_MECHANISMS:true}
storesight.features.discovery.performance-optimization=${FEATURE_DISCOVERY_PERFORMANCE_OPTIMIZATION:true}

# Gradual Rollout Configuration
storesight.features.rollout.enabled=${FEATURE_ROLLOUT_ENABLED:false}
storesight.features.rollout.session-management-rollout-percentage=${FEATURE_ROLLOUT_SESSION_MANAGEMENT_PERCENTAGE:100}
storesight.features.rollout.sse-improvements-rollout-percentage=${FEATURE_ROLLOUT_SSE_IMPROVEMENTS_PERCENTAGE:100}
storesight.features.rollout.cache-optimization-rollout-percentage=${FEATURE_ROLLOUT_CACHE_OPTIMIZATION_PERCENTAGE:100}
storesight.features.rollout.monitoring-enhancements-rollout-percentage=${FEATURE_ROLLOUT_MONITORING_ENHANCEMENTS_PERCENTAGE:100}
storesight.features.rollout.security-hardening-rollout-percentage=${FEATURE_ROLLOUT_SECURITY_HARDENING_PERCENTAGE:100}
storesight.features.rollout.discovery-optimization-rollout-percentage=${FEATURE_ROLLOUT_DISCOVERY_OPTIMIZATION_PERCENTAGE:100}
storesight.features.rollout.strategy=${FEATURE_ROLLOUT_STRATEGY:PERCENTAGE_BASED}

# Alerting Thresholds Configuration
alerting.memory.warning.threshold=80
alerting.memory.critical.threshold=95
alerting.cpu.warning.threshold=80
alerting.cpu.critical.threshold=95
alerting.disk.warning.threshold=80
alerting.disk.critical.threshold=95
alerting.connection-pool.warning.threshold=80
alerting.connection-pool.critical.threshold=95
alerting.session.stuck.threshold=5
alerting.sse.error-rate.threshold=10
alerting.database.error-rate.threshold=5
alerting.cache.hit-rate.threshold=50

# Monitoring Intervals (in milliseconds)
monitoring.system-resources.interval=60000
monitoring.database.interval=120000
monitoring.redis.interval=180000
monitoring.session-cleanup.interval=300000
monitoring.sse-cleanup.interval=60000
monitoring.cache-cleanup.interval=300000
monitoring.dashboard.collection.interval=30000

# HTTP Session Configuration
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=4h

# HTTP Async Processing Configuration - Fix for async processing errors
server.tomcat.max-threads=200
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
server.tomcat.async-timeout=30000

# Admin authentication configuration
# These can be set via environment variables or application properties
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}
# JWT secret must be at least 64 characters (512 bits) for HS512 algorithm
admin.jwt.secret=${JWT_SECRET:}
admin.jwt.secret.fallback=${ADMIN_JWT_SECRET:your-super-secret-jwt-key-that-should-be-at-least-64-characters-long-for-production-use-and-should-be-kept-secure}

# Admin Authentication Configuration
admin.auth.enabled=${ADMIN_AUTH_ENABLED:true}
admin.auth.session-timeout=${ADMIN_SESSION_TIMEOUT:3600}
admin.auth.max-login-attempts=${ADMIN_MAX_LOGIN_ATTEMPTS:5}
admin.auth.lockout-duration=${ADMIN_LOCKOUT_DURATION:900}
admin.auth.token-expiry=${ADMIN_TOKEN_EXPIRY:86400}
admin.auth.require-https=${ADMIN_REQUIRE_HTTPS:true}
admin.auth.audit-logging=${ADMIN_AUDIT_LOGGING:true}

# Admin Security Headers
admin.security.csrf-enabled=${ADMIN_CSRF_ENABLED:true}
admin.security.xss-protection=${ADMIN_XSS_PROTECTION:true}
admin.security.content-security-policy=${ADMIN_CSP:true}
