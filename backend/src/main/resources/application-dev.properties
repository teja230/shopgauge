# Development Profile Configuration
# This profile is used for local development

# CORS Configuration for Development
# Allow localhost origins for development
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173

# Security Configuration for Development
security.rate-limit.enabled=true
security.rate-limit.requests-per-minute=120
security.debug-endpoints.enabled=true

# Development-specific settings
logging.level.com.storesight=DEBUG
logging.level.org.springframework.security=DEBUG

# Development database (if different from main config)
# spring.datasource.url=jdbc:postgresql://localhost:5432/storesight_dev

# Development Redis (if different from main config)
# spring.data.redis.host=localhost
# spring.data.redis.port=6379

# Development frontend URL
frontend.url=http://localhost:5173

# Development Shopify redirect URI
shopify.redirect_uri=http://localhost:8080/api/auth/shopify/callback

# Enable debug endpoints for development
management.endpoints.web.exposure.include=health,info,metrics 

# Development Health Check Configuration (Conservative Settings)
# Reduce monitoring frequency to minimize database load during development

# Database monitoring - every 3 minutes (very conservative for dev)
health.database.monitoring.interval=180000
health.database.connection.timeout=3000

# Redis monitoring - every 5 minutes (very conservative for dev)
health.redis.monitoring.interval=300000
health.redis.connection.timeout=2000

# Development-specific logging
logging.level.com.storesight.backend.service.DatabaseMonitoringService=INFO
logging.level.com.storesight.backend.service.RedisHealthService=INFO
logging.level.com.storesight.backend.controller.HealthController=INFO

# Disable verbose health check logging in development
logging.level.org.springframework.web=INFO 