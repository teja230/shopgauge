# Development profile configuration

# Database configuration for development - use environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/storesight}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:storesight}
spring.datasource.password=${DB_PASS:storesight}

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration for development
spring.flyway.validate-on-migrate=false

# Redis configuration for development (use environment variables)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000ms

# Logging configuration for development
logging.level.com.storesight.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Development-specific settings
server.port=8080
management.endpoints.web.exposure.include=*

# Dummy secrets for development (bypass validation)
shopify.api.key=${SHOPIFY_API_KEY:PLACEHOLDER_API_KEY}
shopify.api.secret=${SHOPIFY_API_SECRET:PLACEHOLDER_API_SECRET}
shopify.webhook.secret=${SHOPIFY_WEBHOOK_SECRET:PLACEHOLDER_WEBHOOK_SECRET}
shopify.scopes=read_products,write_products,read_orders,write_orders
shopify.redirect.uri=http://localhost:8080/auth/callback

# Admin configuration for development
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
admin.email=admin@storesight.dev
admin.jwt.secret=${ADMIN_JWT_SECRET:dev-jwt-secret-key-for-development-only-change-in-production}
admin.jwt.secret.fallback=${JWT_SECRET:}

# Rate limiting for development
rate.limiting.enabled=false
rate.limiting.requests-per-minute=1000

# Cache configuration for development
cache.enabled=true
cache.ttl=300
cache.max-size=1000

# Session configuration for development
session.timeout=3600
session.cleanup.interval=300
session.stuck.timeout=1800

# Monitoring configuration for development
monitoring.enabled=true
monitoring.interval=60
monitoring.alerting.enabled=false

# Cost optimization for development
cost.optimization.enabled=true
cost.optimization.budget.limit=1000
cost.optimization.alert.threshold=0.8

# Market intelligence for development
market.intelligence.enabled=true
market.intelligence.providers=google,serpapi
market.intelligence.cache.ttl=3600
market.intelligence.rate.limit=100

# Competitor tracking for development
competitor.tracking.enabled=true
competitor.tracking.max.competitors=10
competitor.tracking.update.interval=3600

# Notification configuration for development
notifications.enabled=true
notifications.provider=console
notifications.level=INFO

# Security configuration for development
security.enabled=true
security.cors.allowed-origins=http://localhost:3000,http://localhost:5173
security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
security.cors.allowed-headers=*

# Performance configuration for development
performance.monitoring.enabled=true
performance.monitoring.slow-query-threshold=1000
performance.monitoring.memory-threshold=0.8

# Error handling for development
error.handling.detailed-messages=true
error.handling.stack-trace-enabled=true 