# Exported from Render on 2025-06-24T20:11:18Z
databases:
  - name: storesight-db
    databaseName: storesight
    user: storesight_user
    plan: free
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
    postgresMajorVersion: "16"

services:
  - type: web
    name: storesight-backend
    runtime: docker
    repo: https://github.com/teja230/storesight
    plan: free
    envVars:
      # Database Configuration
      - key: DB_URL
        fromDatabase:
          name: storesight-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: storesight-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: storesight-db
          property: password
      
      # Redis Configuration
      - key: REDIS_HOST
        fromService:
          name: storesight-redis
          type: keyvalue
          property: host
      - key: REDIS_PORT
        value: "6379"
      
      # Application Configuration
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
      - key: SERVER_PORT
        value: "8080"
      - key: BACKEND_URL
        value: "https://api.shopgaugeai.com"
      - key: FRONTEND_URL
        value: "https://www.shopgaugeai.com"
      
      # Shopify Configuration
      - key: SHOPIFY_API_KEY
        value: "***REDACTED***"
      - key: SHOPIFY_API_SECRET
        value: "***REDACTED***"
      - key: SHOPIFY_REDIRECT_URI
        value: "https://api.shopgaugeai.com/api/auth/shopify/callback"
      - key: SHOPIFY_SCOPES
        value: "read_products,read_orders,read_customers,read_inventory"
      - key: SHOPIFY_API_VERSION
        value: "2023-10"
      
      # Security Configuration
      - key: JWT_SECRET
        value: "***REDACTED***"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "***REDACTED***"
      - key: ADMIN_JWT_SECRET
        value: "***REDACTED***"
      
      # API Keys
      - key: SCRAPINGDOG_KEY
        value: "***REDACTED***"
      - key: SERPER_KEY
        value: "***REDACTED***"
      - key: SERPAPI_KEY
        value: "***REDACTED***"
      
      # Feature Flags
      - key: DISCOVERY_ENABLED
        value: "true"
      - key: DISCOVERY_MULTI_SOURCE_ENABLED
        value: "true"
      - key: DISCOVERY_FALLBACK_ENABLED
        value: "true"
      - key: HEALTH_CHECK_ENABLED
        value: "true"
      - key: METRICS_ENABLED
        value: "true"
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "true"
      - key: SMS_NOTIFICATIONS_ENABLED
        value: "true"
      
      # Logging Configuration
      - key: LOGGING_LEVEL_ROOT
        value: "WARN"
      - key: LOGGING_LEVEL_STORESIGHT
        value: "INFO"
      - key: LOGGING_LEVEL_SPRING
        value: "WARN"
      - key: LOGGING_LEVEL_HIBERNATE
        value: "WARN"
    region: oregon
    dockerContext: .
    dockerfilePath: backend/Dockerfile.prod
    autoDeployTrigger: "on"
    
  - type: web
    name: storesight
    runtime: static
    repo: https://github.com/teja230/storesight
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://api.shopgaugeai.com"
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: "on"
    rootDir: frontend
    # Configure redirects for SPA routing
    redirects:
      - source: "/api/*"
        destination: "https://api.shopgaugeai.com/api/:splat"
        action: "rewrite"
      - source: "/*"
        destination: "/index.html"
        action: "rewrite"

  - type: keyvalue
    name: storesight-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 57.132.182.47/32
        description: teja230@gmail.com
    version: "1"
